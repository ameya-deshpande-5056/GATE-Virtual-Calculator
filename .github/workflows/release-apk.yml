name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, for example v1.2.3'
        required: true
        default: v1.0.0

jobs:
  build-and-release:
    name: Build Android APK and publish GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.inputs.version || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename APK asset
        run: cp build/app/outputs/flutter-apk/app-release.apk gate-calculator-${{ env.RELEASE_TAG }}.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: gate-calculator-${{ env.RELEASE_TAG }}.apk
          generate_release_notes: true
